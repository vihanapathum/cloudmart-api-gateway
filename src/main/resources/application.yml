server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOriginPatterns: "*"
                allowedMethods: [GET, POST, PUT, DELETE, OPTIONS]
                allowedHeaders: "*"
          routes:
            - id: product-service
              uri: http://${PRODUCT_SERVICE_HOST:localhost}:8081
              predicates:
                - Path=/api/products/**
            - id: order-service
              uri: http://${ORDER_SERVICE_HOST:localhost}:8082
              predicates:
                - Path=/api/orders/**
            - id: user-service
              uri: http://${USER_SERVICE_HOST:localhost}:8083
              predicates:
                - Path=/api/users/**
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
      cors:
        allowed-origins: "*"
        allowed-methods: "*"
